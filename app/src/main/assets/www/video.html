<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>机房监控系统 - 视频监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <style>
        body { background-color: #f4f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .card { background-color: white; border-radius: 1.25rem; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .h-safe { height: env(safe-area-inset-bottom, 20px); }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .video-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
            padding-top: 0;
        }
        .video-container.fullscreen img, .video-container.fullscreen iframe {
            object-fit: contain;
            background-color: black;
        }
        .video-container img, .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            background-color: #1a1a1a;
            z-index: 10;
        }
    </style>
</head>
<body class="pb-[6.5rem]">
    <!-- Top Header -->
    <header class="bg-white px-5 pt-[3.25rem] pb-5 rounded-b-[2rem] shadow-[0_2px_10px_rgba(0,0,0,0.03)] z-10 relative">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="pageTitle" class="text-[1.8rem] font-extrabold text-[#1a1f36] tracking-tight mb-1.5">实时监控</h1>
                <div class="flex items-center">
                    <span id="connIndicator" class="w-2.5 h-2.5 bg-yellow-500 rounded-full mr-2 shadow-[0_0_8px_rgba(234,179,8,0.6)]"></span>
                    <span id="connStatus" class="text-yellow-600 text-[13px] font-bold tracking-wide">等待连接...</span>
                </div>
            </div>
            <button onclick="reloadVideo()" class="w-[3rem] h-[3rem] bg-gray-50 hover:bg-gray-100 border border-gray-100/80 rounded-full flex items-center justify-center text-[#6b7280] active:scale-95 transition-all shadow-sm">
                <i id="refreshIcon" class="fas fa-sync-alt text-[1.1rem]"></i>
            </button>
        </div>
    </header>

    <main class="px-5 space-y-[1.1rem] mt-[1.1rem]">
        <!-- Video Card -->
        <div class="card p-4 border border-gray-50/50">
            <div class="flex justify-between items-center mb-4 px-1">
                <div class="flex items-center">
                    <div class="w-8 h-8 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-video text-sm"></i>
                    </div>
                    <div>
                        <h2 class="text-[15px] font-bold text-gray-800">主摄像头画面</h2>
                        <p class="text-[10px] text-gray-400 font-medium tracking-wide mt-0.5" id="videoUrlText">正在获取流地址...</p>
                    </div>
                </div>
                <div class="text-gray-300">
                    <i class="fas fa-signal"></i>
                </div>
            </div>
            
            <div class="video-container shadow-inner border border-gray-800" id="videoContainer">
                <button id="exitFullscreenBtn" onclick="toggleFullScreen()" class="hidden absolute top-6 right-6 z-[10000] w-10 h-10 bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur-md hover:bg-black/60 active:scale-95 transition-all shadow-lg border border-white/20">
                    <i class="fas fa-compress text-lg"></i>
                </button>
                <div id="loadingOverlay" class="loading-overlay">
                    <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                    <span class="text-xs font-bold tracking-wider">正在连接视频流...</span>
                </div>
                <img id="videoStream" src="" alt="视频流加载失败" onerror="handleVideoError()" onload="handleVideoLoad()" class="hidden">
            </div>
            
            <div class="mt-4 flex justify-end items-center px-1">
                <button onclick="toggleFullScreen()" class="px-5 py-2.5 bg-gray-50 hover:bg-gray-100 text-gray-600 rounded-xl text-[12px] font-bold active:scale-95 transition-all shadow-sm border border-gray-100"><i class="fas fa-expand mr-1.5"></i> 全屏观看</button>
            </div>
        </div>

        <!-- Dynamic Video Data Cards Container -->
        <div id="videoDataContainer" class="grid grid-cols-2 gap-3 hidden">
            <!-- JS dynamically injected -->
        </div>

        <div class="card p-5 border border-gray-50/50">
            <div class="flex items-center mb-3">
                <i class="fas fa-info-circle text-blue-500 mr-2 text-sm"></i>
                <h3 class="text-[13px] font-bold text-gray-800">配置说明</h3>
            </div>
            <p class="text-[12px] text-gray-500 leading-relaxed">
                视频流地址及附加数据(如检测人数等)配置默认从“我的 - 系统设置”中读取。请确保在设置中填入正确的信息。
            </p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-100 flex justify-around pt-3 pb-safe z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
        <a href="index.html" class="flex flex-col items-center space-y-1 w-[20%] mb-1 text-gray-400 hover:text-gray-600 transition">
            <i class="fas fa-home text-[1.25rem] mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wide">首页</span>
        </a>
        <a href="monitoring.html" class="flex flex-col items-center space-y-1 w-[20%] mb-1 text-gray-400 hover:text-gray-600 transition">
            <i class="fas fa-chart-bar text-[1.25rem] mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wide">监测</span>
        </a>
        <a href="video.html" class="flex flex-col items-center space-y-1 w-[20%] mb-1 text-blue-500">
            <i class="fas fa-video text-[1.25rem] mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wide">视频</span>
        </a>
        <a href="control.html" class="flex flex-col items-center space-y-1 w-[20%] mb-1 text-gray-400 hover:text-gray-600 transition">
            <i class="fas fa-sliders-h text-[1.25rem] mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wide">控制</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center space-y-1 w-[20%] mb-1 text-gray-400 hover:text-gray-600 transition">
            <i class="far fa-user text-[1.25rem] mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-wide">我的</span>
        </a>
        <div class="h-safe w-full absolute bottom-0"></div>
    </nav>

    <script>
        let currentVideoUrl = "";
        let dataSyncTimer = null;
        let currentVideoDataModel = [];

        function renderVideoDataCards() {
            const container = document.getElementById('videoDataContainer');
            if (!currentVideoDataModel || currentVideoDataModel.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            container.innerHTML = currentVideoDataModel.map(item => {
                const colors = COLOR_CLASSES[item.color] || COLOR_CLASSES['slate'];
                return `
                    <div class="card p-3.5 border border-gray-50/50 flex flex-col justify-between" id="card-${item.id}">
                        <div class="flex items-center justify-between mb-2">
                            <div class="w-8 h-8 rounded-full ${colors.bg} ${colors.text} flex items-center justify-center border ${colors.border}">
                                <i class="fas ${item.icon} text-sm"></i>
                            </div>
                            <span class="text-[9px] text-gray-400 font-mono">${item.cloudKey}</span>
                        </div>
                        <div>
                            <h3 class="text-[12px] font-bold text-gray-800 mb-0.5">${item.name}</h3>
                            <div class="flex items-baseline">
                                <span class="text-xl font-extrabold ${colors.text} tracking-tight" id="val-${item.id}">--</span>
                                ${item.unit ? `<span class="text-[10px] font-bold text-gray-400 ml-1">${item.unit}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function syncVideoData() {
            if (!currentVideoDataModel || currentVideoDataModel.length === 0) return;
            try {
                const data = await OneNetService.getLatestData();
                if (data) {
                    // Pull in alarm checking logic
                    let alarmStates = JSON.parse(localStorage.getItem('iot_alarm_states') || '{}');
                    let alerts = JSON.parse(localStorage.getItem('iot_alerts') || '[]');
                    let hasNewAlert = false;
                    const now = new Date();

                    currentVideoDataModel.forEach(item => {
                        const el = document.getElementById(`val-${item.id}`);
                        if (el && data[item.id] !== undefined) {
                            let displayVal = data[item.id];
                            let numericVal = null;
                            
                            if (typeof displayVal === 'number') {
                                numericVal = displayVal;
                                const decimals = typeof getDecimals === 'function' ? getDecimals(item.dataType, item.step) : 1;
                                displayVal = displayVal.toFixed(decimals);
                            } else if (typeof displayVal === 'boolean') {
                                displayVal = displayVal ? '是' : '否';
                            }
                            el.innerText = displayVal;

                            // Alarm Check
                            if (!data._isMock && data._isOnline !== false && numericVal !== null) {
                                const checkThresh = (isHigh, thresh) => {
                                    const stateKey = `${item.id}_${isHigh ? 'high' : 'low'}`;
                                    if (isHigh ? numericVal > thresh : numericVal < thresh) {
                                        if (!alarmStates[stateKey]) {
                                            const title = `${item.name}${isHigh ? '过高' : '过低'}报警`;
                                            const lastAlert = alerts.find(a => a.title === title);
                                            if (!lastAlert || (now.getTime() - new Date(lastAlert.timestamp).getTime() > 5 * 60 * 1000)) {
                                                alarmStates[stateKey] = true;
                                                alerts.unshift({
                                                    id: Date.now(),
                                                    title: title,
                                                    type: item.id,
                                                    currentValue: numericVal,
                                                    threshold: thresh,
                                                    unit: item.unit || '',
                                                    time: `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`,
                                                    timestamp: now.getTime(),
                                                    status: 'unread',
                                                    isCritical: true
                                                });
                                                hasNewAlert = true;
                                                
                                                // Optional: Visual indicator on the card itself
                                                const card = document.getElementById(`card-${item.id}`);
                                                if(card) {
                                                    card.classList.remove('border-gray-50/50');
                                                    card.classList.add('border-red-400', 'bg-red-50/30');
                                                    setTimeout(() => {
                                                        card.classList.add('border-gray-50/50');
                                                        card.classList.remove('border-red-400', 'bg-red-50/30');
                                                    }, 3000);
                                                }
                                            }
                                        }
                                    } else {
                                        if (alarmStates[stateKey]) {
                                            alarmStates[stateKey] = false;
                                            hasNewAlert = true;
                                        }
                                    }
                                };

                                if (item.max !== undefined) checkThresh(true, item.max);
                                if (item.min !== undefined) checkThresh(false, item.min);
                            }
                        }
                    });

                    if (hasNewAlert) {
                        if (alerts.length > 50) alerts.pop();
                        localStorage.setItem('iot_alerts', JSON.stringify(alerts));
                        localStorage.setItem('iot_alarm_states', JSON.stringify(alarmStates));
                    }
                }
            } catch (err) {
                console.error('Sync video data failed:', err);
            }
        }

        function initVideo() {
            // Set dynamic page title
            const customTitle = localStorage.getItem('iot_video_title');
            if (customTitle) {
                document.getElementById('pageTitle').innerText = customTitle;
                document.title = `机房监控系统 - ${customTitle}`;
            }

            const config = JSON.parse(localStorage.getItem('iot_config') || '{}');
            currentVideoUrl = config.videoUrl || '';
            
            // Initialize dynamic video data modules
            const fullModel = getDataModel();
            currentVideoDataModel = fullModel.videoData || [];
            
            renderVideoDataCards();
            
            if (currentVideoDataModel.length > 0) {
                syncVideoData();
                if (dataSyncTimer) clearInterval(dataSyncTimer);
                dataSyncTimer = setInterval(syncVideoData, 5000);
            } else {
                if (dataSyncTimer) clearInterval(dataSyncTimer);
            }
            
            const overlay = document.getElementById('loadingOverlay');
            const img = document.getElementById('videoStream');
            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');
            
            if (!currentVideoUrl) {
                document.getElementById('videoUrlText').innerText = "未配置视频流地址";
                img.classList.add('hidden');
                overlay.style.display = 'flex';
                
                overlay.innerHTML = `
                    <div class="w-12 h-12 bg-yellow-900/50 rounded-full flex items-center justify-center text-yellow-500 mb-3">
                        <i class="fas fa-cog text-xl"></i>
                    </div>
                    <span class="text-xs font-bold text-yellow-500 tracking-wider">尚未配置视频源</span>
                    <span class="text-[10px] text-gray-500 mt-2">请在“我的”页面填写您的监控地址</span>
                    <button onclick="window.location.href='settings.html'" class="mt-4 px-4 py-2 bg-yellow-500/20 text-yellow-500 rounded-lg text-[11px] font-bold border border-yellow-500/30 active:bg-yellow-500/30 transition">去配置</button>
                `;
                
                connIndicator.className = 'w-2.5 h-2.5 bg-yellow-500 rounded-full mr-2 shadow-[0_0_8px_rgba(234,179,8,0.6)]';
                connStatus.innerText = '未配置';
                connStatus.className = 'text-yellow-600 text-[13px] font-bold tracking-wide';
                return;
            }

            document.getElementById('videoUrlText').innerText = currentVideoUrl;
            img.classList.add('hidden');
            
            // Restore original loading spinner
            overlay.innerHTML = `
                <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                <span class="text-xs font-bold tracking-wider">正在连接视频流...</span>
            `;
            overlay.style.display = 'flex';
            
            // Add a timestamp to bypass cache
            img.src = currentVideoUrl + (currentVideoUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            
            // Fallback for MJPEG streams: some Android WebViews don't fire onload for continuous streams
            setTimeout(() => {
                if (overlay.style.display !== 'none' && img.src && !img.classList.contains('error')) {
                    handleVideoLoad();
                }
            }, 1500);
        }

        function reloadVideo() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            initVideo();
            setTimeout(() => icon.classList.remove('fa-spin'), 1000);
        }

        function handleVideoLoad() {
            const img = document.getElementById('videoStream');
            img.classList.remove('error');
            document.getElementById('loadingOverlay').style.display = 'none';
            img.classList.remove('hidden');
            
            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');
            connIndicator.className = 'w-2.5 h-2.5 bg-[#22c55e] rounded-full mr-2 shadow-[0_0_8px_rgba(34,197,94,0.4)]';
            connStatus.innerText = '已连接';
            connStatus.className = 'text-[#22c55e] text-[13px] font-bold tracking-wide';
        }

        function handleVideoError() {
            const img = document.getElementById('videoStream');
            img.classList.add('error');
            const overlay = document.getElementById('loadingOverlay');
            overlay.innerHTML = `
                <div class="w-12 h-12 bg-red-900/50 rounded-full flex items-center justify-center text-red-500 mb-3">
                    <i class="fas fa-video-slash text-xl"></i>
                </div>
                <span class="text-xs font-bold text-red-400 tracking-wider">连接断开或无法访问</span>
                <span class="text-[10px] text-gray-500 mt-2">请检查服务器地址或网络</span>
            `;
            
            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');
            connIndicator.className = 'w-2.5 h-2.5 bg-red-500 rounded-full mr-2 shadow-[0_0_8px_rgba(239,68,68,0.6)]';
            connStatus.innerText = '连接失败';
            connStatus.className = 'text-red-500 text-[13px] font-bold tracking-wide';
        }

        function toggleFullScreen() {
            const container = document.getElementById('videoContainer');
            const exitBtn = document.getElementById('exitFullscreenBtn');
            
            if (container.classList.contains('fullscreen')) {
                // Exit fullscreen
                container.classList.remove('fullscreen');
                exitBtn.classList.add('hidden');
                
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(err => console.log(err));
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } else {
                // Enter fullscreen
                container.classList.add('fullscreen');
                exitBtn.classList.remove('hidden');
                
                if (container.requestFullscreen) {
                    container.requestFullscreen().catch(err => console.log(err));
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            }
        }

        // Listen for native fullscreen change events to sync UI state
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            const container = document.getElementById('videoContainer');
            const exitBtn = document.getElementById('exitFullscreenBtn');
            
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            
            if (!isFullscreen && container.classList.contains('fullscreen')) {
                container.classList.remove('fullscreen');
                exitBtn.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', initVideo);
    </script>
</body>
</html>
