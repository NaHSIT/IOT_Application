<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 视频监控</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #141414;
            border-radius: var(--radius-s);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .video-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
            padding-top: 0;
        }
        .video-container.fullscreen img, .video-container.fullscreen iframe {
            object-fit: contain;
            background-color: black;
        }
        .video-container img, .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8a9099;
            background-color: #141414;
            z-index: 10;
        }
        .video-exit {
            position: absolute; top: 24px; right: 24px; z-index: 10000;
            width: 40px; height: 40px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            color: #fff; background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .video-exit.open { display: flex; }
        .video-exit:active { background: rgba(0, 0, 0, 0.6); }
        .overlay-btn {
            margin-top: 14px; padding: 8px 16px; border-radius: 9px;
            font-size: 12px; font-weight: 500; border: 1px solid var(--border);
            background: var(--card); color: var(--text);
        }
        .overlay-btn:active { opacity: 0.8; }
    </style>
</head>
<body class="pb-nav">
    <!-- Top Header -->
    <header class="page-header">
        <div class="header-row">
            <div>
                <h1 id="pageTitle" class="header-title mb-1.5">实时监控</h1>
                <div class="header-sub">
                    <span id="connIndicator" class="dot dot-warn"></span>
                    <span id="connStatus" class="text-warn">等待连接...</span>
                </div>
            </div>
            <button onclick="reloadVideo()" class="icon-btn">
                <i id="refreshIcon" class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <main class="px-5 mt-4 flex flex-col gap-4">
        <!-- Video Card -->
        <div class="card p-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <div class="tile tile-sm tile-blue">
                        <i class="fas fa-video text-xs"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-medium">主摄像头画面</h2>
                        <p class="text-tip mt-0.5 mono truncate" style="font-size: 11px; max-width: 200px;" id="videoUrlText">正在获取流地址...</p>
                    </div>
                </div>
                <div class="text-tip">
                    <i class="fas fa-signal text-sm"></i>
                </div>
            </div>

            <div class="video-container" id="videoContainer">
                <button id="exitFullscreenBtn" onclick="toggleFullScreen()" class="video-exit">
                    <i class="fas fa-compress"></i>
                </button>
                <div id="loadingOverlay" class="loading-overlay">
                    <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                    <span class="text-xs">正在连接视频流...</span>
                </div>
                <img id="videoStream" src="" alt="视频流加载失败" onerror="handleVideoError()" onload="handleVideoLoad()" class="hidden">
            </div>

            <div class="mt-4 flex justify-end">
                <button onclick="toggleFullScreen()" class="btn btn-ghost btn-sm"><i class="fas fa-expand mr-1.5"></i> 全屏观看</button>
            </div>
        </div>

        <!-- Dynamic Video Data Cards Container -->
        <div id="videoDataContainer" class="grid grid-cols-2 gap-3 hidden">
            <!-- JS dynamically injected -->
        </div>

        <div class="card p-4">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas fa-info-circle text-accent text-sm"></i>
                <h3 class="text-sm font-medium">配置说明</h3>
            </div>
            <p class="text-xs text-sub" style="line-height: 1.7;">
                视频流地址及附加数据(如检测人数等)配置默认从“我的 - 系统设置”中读取。请确保在设置中填入正确的信息。
            </p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="monitoring.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>监测</span>
        </a>
        <a href="video.html" class="nav-item active">
            <i class="fas fa-video"></i>
            <span>视频</span>
        </a>
        <a href="control.html" class="nav-item">
            <i class="fas fa-sliders-h"></i>
            <span>控制</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <script>
        let currentVideoUrl = "";
        let dataSyncTimer = null;
        let currentVideoDataModel = [];

        function renderVideoDataCards() {
            const container = document.getElementById('videoDataContainer');
            if (!currentVideoDataModel || currentVideoDataModel.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = currentVideoDataModel.map(item => {
                const colors = COLOR_CLASSES[item.color] || COLOR_CLASSES['slate'];
                return `
                    <div class="card p-3.5 flex flex-col justify-between" id="card-${item.id}">
                        <div class="flex items-center justify-between mb-2">
                            <div class="tile tile-sm ${colors.bg}">
                                <i class="fas ${item.icon} text-xs"></i>
                            </div>
                            <span class="text-tip mono" style="font-size: 9px;">${item.cloudKey}</span>
                        </div>
                        <div>
                            <h3 class="text-xs font-medium mb-0.5">${item.name}</h3>
                            <div class="flex items-baseline">
                                <span class="text-xl font-medium num ${colors.text}" id="val-${item.id}">--</span>
                                ${item.unit ? `<span class="text-tip ml-1" style="font-size: 10px;">${item.unit}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function syncVideoData() {
            if (!currentVideoDataModel || currentVideoDataModel.length === 0) return;
            try {
                const data = await OneNetService.getLatestData();
                if (data) {
                    // Pull in alarm checking logic
                    let alarmStates = JSON.parse(localStorage.getItem('iot_alarm_states') || '{}');
                    let alerts = JSON.parse(localStorage.getItem('iot_alerts') || '[]');
                    let hasNewAlert = false;
                    const now = new Date();

                    currentVideoDataModel.forEach(item => {
                        const el = document.getElementById(`val-${item.id}`);
                        if (el && data[item.id] !== undefined) {
                            let displayVal = data[item.id];
                            let numericVal = null;

                            if (typeof displayVal === 'number') {
                                numericVal = displayVal;
                                const decimals = typeof getDecimals === 'function' ? getDecimals(item.dataType, item.step) : 1;
                                displayVal = displayVal.toFixed(decimals);
                            } else if (typeof displayVal === 'boolean') {
                                displayVal = displayVal ? '是' : '否';
                            }
                            el.innerText = displayVal;

                            // Alarm Check
                            if (!data._isMock && data._isOnline !== false && numericVal !== null) {
                                const checkThresh = (isHigh, thresh) => {
                                    const stateKey = `${item.id}_${isHigh ? 'high' : 'low'}`;
                                    if (isHigh ? numericVal > thresh : numericVal < thresh) {
                                        if (!alarmStates[stateKey]) {
                                            const title = `${item.name}${isHigh ? '过高' : '过低'}报警`;
                                            const lastAlert = alerts.find(a => a.title === title);
                                            if (!lastAlert || (now.getTime() - new Date(lastAlert.timestamp).getTime() > 5 * 60 * 1000)) {
                                                alarmStates[stateKey] = true;
                                                alerts.unshift({
                                                    id: Date.now(),
                                                    title: title,
                                                    type: item.id,
                                                    currentValue: numericVal,
                                                    threshold: thresh,
                                                    unit: item.unit || '',
                                                    time: `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`,
                                                    timestamp: now.getTime(),
                                                    status: 'unread',
                                                    isCritical: true
                                                });
                                                hasNewAlert = true;

                                                // Optional: Visual indicator on the card itself
                                                const card = document.getElementById(`card-${item.id}`);
                                                if(card) {
                                                    card.style.borderColor = 'var(--danger)';
                                                    setTimeout(() => {
                                                        card.style.borderColor = '';
                                                    }, 3000);
                                                }
                                            }
                                        }
                                    } else {
                                        if (alarmStates[stateKey]) {
                                            alarmStates[stateKey] = false;
                                            hasNewAlert = true;
                                        }
                                    }
                                };

                                if (item.max !== undefined) checkThresh(true, item.max);
                                if (item.min !== undefined) checkThresh(false, item.min);
                            }
                        }
                    });

                    if (hasNewAlert) {
                        if (alerts.length > 50) alerts.pop();
                        localStorage.setItem('iot_alerts', JSON.stringify(alerts));
                        localStorage.setItem('iot_alarm_states', JSON.stringify(alarmStates));
                    }
                }
            } catch (err) {
                console.error('Sync video data failed:', err);
            }
        }

        function initVideo() {
            // Set dynamic page title
            const customTitle = localStorage.getItem('iot_video_title');
            if (customTitle) {
                document.getElementById('pageTitle').innerText = customTitle;
                document.title = `机房监控系统 - ${customTitle}`;
            }

            const config = JSON.parse(localStorage.getItem('iot_config') || '{}');
            currentVideoUrl = config.videoUrl || '';

            // Initialize dynamic video data modules
            const fullModel = getDataModel();
            currentVideoDataModel = fullModel.videoData || [];

            renderVideoDataCards();

            if (currentVideoDataModel.length > 0) {
                syncVideoData();
                if (dataSyncTimer) clearInterval(dataSyncTimer);
                dataSyncTimer = setInterval(syncVideoData, 5000);
            } else {
                if (dataSyncTimer) clearInterval(dataSyncTimer);
            }

            const overlay = document.getElementById('loadingOverlay');
            const img = document.getElementById('videoStream');
            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');

            if (!currentVideoUrl) {
                document.getElementById('videoUrlText').innerText = "未配置视频流地址";
                img.classList.add('hidden');
                overlay.style.display = 'flex';

                overlay.innerHTML = `
                    <div class="tile" style="background: var(--warn-bg); color: var(--warn); width: 48px; height: 48px; font-size: 20px; margin-bottom: 12px;">
                        <i class="fas fa-cog"></i>
                    </div>
                    <span class="text-xs font-medium" style="color: var(--warn);">尚未配置视频源</span>
                    <span class="text-tip mt-2" style="font-size: 11px;">请在“我的”页面填写您的监控地址</span>
                    <button onclick="window.location.href='settings.html'" class="overlay-btn">去配置</button>
                `;

                connIndicator.className = 'dot dot-warn';
                connStatus.innerText = '未配置';
                connStatus.className = 'text-warn';
                return;
            }

            document.getElementById('videoUrlText').innerText = currentVideoUrl;
            img.classList.add('hidden');

            // Restore original loading spinner
            overlay.innerHTML = `
                <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                <span class="text-xs">正在连接视频流...</span>
            `;
            overlay.style.display = 'flex';

            // Add a timestamp to bypass cache
            img.src = currentVideoUrl + (currentVideoUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

            // Fallback for MJPEG streams: some Android WebViews don't fire onload for continuous streams
            setTimeout(() => {
                if (overlay.style.display !== 'none' && img.src && !img.classList.contains('error')) {
                    handleVideoLoad();
                }
            }, 1500);
        }

        function reloadVideo() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            initVideo();
            setTimeout(() => icon.classList.remove('fa-spin'), 1000);
        }

        function handleVideoLoad() {
            const img = document.getElementById('videoStream');
            img.classList.remove('error');
            document.getElementById('loadingOverlay').style.display = 'none';
            img.classList.remove('hidden');

            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');
            connIndicator.className = 'dot dot-ok';
            connStatus.innerText = '已连接';
            connStatus.className = 'text-ok';
        }

        function handleVideoError() {
            const img = document.getElementById('videoStream');
            img.classList.add('error');
            const overlay = document.getElementById('loadingOverlay');
            overlay.innerHTML = `
                <div class="tile" style="background: var(--danger-bg); color: var(--danger); width: 48px; height: 48px; font-size: 20px; margin-bottom: 12px;">
                    <i class="fas fa-video-slash"></i>
                </div>
                <span class="text-xs font-medium" style="color: var(--danger);">连接断开或无法访问</span>
                <span class="text-tip mt-2" style="font-size: 11px;">请检查服务器地址或网络</span>
            `;

            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');
            connIndicator.className = 'dot dot-alarm';
            connStatus.innerText = '连接失败';
            connStatus.className = 'text-danger';
        }

        function toggleFullScreen() {
            const container = document.getElementById('videoContainer');
            const exitBtn = document.getElementById('exitFullscreenBtn');

            if (container.classList.contains('fullscreen')) {
                // Exit fullscreen
                container.classList.remove('fullscreen');
                exitBtn.classList.remove('open');

                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(err => console.log(err));
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } else {
                // Enter fullscreen
                container.classList.add('fullscreen');
                exitBtn.classList.add('open');

                if (container.requestFullscreen) {
                    container.requestFullscreen().catch(err => console.log(err));
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            }
        }

        // Listen for native fullscreen change events to sync UI state
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            const container = document.getElementById('videoContainer');
            const exitBtn = document.getElementById('exitFullscreenBtn');

            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFullscreen && container.classList.contains('fullscreen')) {
                container.classList.remove('fullscreen');
                exitBtn.classList.remove('open');
            }
        }

        window.addEventListener('DOMContentLoaded', initVideo);
    </script>
</body>
</html>
