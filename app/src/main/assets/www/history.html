<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 历史查询</title>
    <link rel="stylesheet" href="css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <style>
        .trend-wrap { height: 224px; transition: opacity 0.25s ease; }
        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .data-row:last-child { border-bottom: none; }
        .table-head {
            display: flex; justify-content: space-between;
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            font-size: 11px; color: var(--text-3); background: var(--card-2);
        }
    </style>
</head>
<body class="pb-nav">
    <!-- Header -->
    <header class="subheader">
        <a href="javascript:history.back()" class="subheader-back">
            <i class="fas fa-chevron-left"></i>
        </a>
        <div class="subheader-title">
            <h1>历史数据查询</h1>
            <span id="deviceStatus" class="hidden items-center gap-1 mt-0.5" style="font-size: 10px; font-weight: 400; color: var(--text-3);">
                <span class="dot dot-warn" style="width: 6px; height: 6px;"></span> 设备离线
            </span>
        </div>
        <div class="subheader-side">
            <button onclick="exportHistoryData()" class="flex items-center gap-1.5 text-accent text-sm cursor-pointer">
                <i class="fas fa-file-export text-xs"></i>
                <span>导出</span>
            </button>
        </div>
    </header>

    <main class="px-5 py-5 flex flex-col gap-4">
        <!-- Custom Toast -->
        <div id="toast" class="toast">
            <!-- Toast message -->
        </div>

        <!-- Filter Tabs -->
        <div id="filterTabsContainer" class="tabs" style="flex-wrap: nowrap; overflow-x: auto;"></div>

        <!-- Trend Chart -->
        <div class="card p-5">
            <div class="flex justify-between items-center mb-5">
                <h3 id="chartTitle" class="text-base font-medium">变化曲线</h3>
            </div>

            <div id="historyChartWrap" class="chart-box trend-wrap">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card overflow-hidden">
            <div class="table-head">
                <span>采样时间</span>
                <span>数值</span>
            </div>
            <div id="dataTableBody" style="max-height: 40vh; overflow-y: auto;">
                <!-- Data will be populated here by JS -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="monitoring.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>监测</span>
        </a>
        <a href="video.html" class="nav-item">
            <i class="fas fa-video"></i>
            <span>视频</span>
        </a>
        <a href="control.html" class="nav-item">
            <i class="fas fa-sliders-h"></i>
            <span>控制</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </a>
    </nav>


    <script>
        const currentModel = getDataModel();
        const sensors = currentModel.sensors;

        // 图表颜色取自主题变量，自动适配深浅色
        function hueColor(color, alpha) {
            const v = getComputedStyle(document.documentElement).getPropertyValue(`--hue-${color}`).trim() || '#5f6b7a';
            if (alpha === undefined) return v;
            const n = parseInt(v.slice(1), 16);
            return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
        }
        const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        const historyChartWrap = document.getElementById('historyChartWrap');
        const chartTitle = document.getElementById('chartTitle');
        const ctx = document.getElementById('historyChart').getContext('2d');

        let historyChart;
        let metricConfig = {};
        let labels = [];
        let fullTimes = [];

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function exportHistoryData() {
            let historyData = JSON.parse(localStorage.getItem('iot_history_data') || '[]');

            // Filter for the last 24 hours to match the UI
            const now = new Date();
            const twentyFourHoursAgo = now.getTime() - (24 * 60 * 60 * 1000);
            const displayData = historyData.filter(item => {
                let itemTime = item.timestamp;
                if (!itemTime && item.fullTime) {
                    itemTime = new Date(item.fullTime.replace(/-/g, '/')).getTime();
                }
                return itemTime >= twentyFourHoursAgo;
            });

            if (displayData.length === 0) {
                showToast('暂无历史数据可导出');
                return;
            }

            try {
                // Prepare CSV content with BOM for Excel compatibility
                let csvContent = '\uFEFF';

                // Build Headers
                const headers = ['记录时间', '完整时间'];
                sensors.forEach(s => {
                    const colName = `${s.name}(${s.unit})`.replace(/"/g, '""');
                    headers.push(`"${colName}"`);
                });
                csvContent += headers.join(',') + '\n';

                // Build Rows
                displayData.forEach(item => {
                    const row = [
                        item.time || '',
                        item.fullTime || ''
                    ];
                    sensors.forEach(s => {
                        const val = item.data[s.id];
                        let cell = val !== undefined && val !== null ? String(val) : '';
                        if (cell.includes(',') || cell.includes('"') || cell.includes('\n')) {
                            cell = '"' + cell.replace(/"/g, '""') + '"';
                        }
                        row.push(cell);
                    });
                    csvContent += row.join(',') + '\n';
                });

                const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}`;
                const fileName = `监控历史数据_${dateStr}.csv`;

                // 检测是否在 Android 原生 WebView 环境中，并注入了自定义 Javascript 接口
                if (window.AndroidApp && window.AndroidApp.shareCSV) {
                    window.AndroidApp.shareCSV(fileName, csvContent);
                    showToast('请在弹出的面板中选择发送或保存');
                } else {
                    // Fallback: 普通浏览器环境下的下载处理
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');

                    link.setAttribute('href', url);
                    link.setAttribute('download', fileName);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast('导出成功');
                }
            } catch (err) {
                console.error('Export error:', err);
                showToast('导出失败，请检查系统权限');
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let currentMetric = urlParams.get('metric') || (sensors.length > 0 ? sensors[0].id : null);

        function initTabs() {
            const container = document.getElementById('filterTabsContainer');
            sensors.forEach((s, index) => {
                const isSelected = s.id === currentMetric;
                container.innerHTML += `
                    <button type="button" data-metric="${s.id}" class="metric-tab tab ${isSelected ? 'active' : ''}">
                        <i class="fas ${s.icon} mr-1"></i> ${s.name}
                    </button>
                `;
            });

            document.querySelectorAll('.metric-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    setMetric(this.dataset.metric);
                });
            });
        }

        function loadData() {
            let historyData = JSON.parse(localStorage.getItem('iot_history_data') || '[]');

            const now = new Date();
            const twentyFourHoursAgo = now.getTime() - (24 * 60 * 60 * 1000);

            const displayData = historyData.filter(item => {
                let itemTime = item.timestamp;
                if (!itemTime && item.fullTime) {
                    itemTime = new Date(item.fullTime.replace(/-/g, '/')).getTime();
                }
                return itemTime >= twentyFourHoursAgo;
            });

            labels = displayData.map(item => item.time);
            fullTimes = displayData.map(item => item.fullTime);

            if (labels.length === 0) {
                labels.push(`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`);
                fullTimes.push(`${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${labels[0]}:00`);
            }

            sensors.forEach(s => {
                let dataArr = displayData.map(item => item.data[s.id] !== undefined ? item.data[s.id] : null);
                if (dataArr.length === 0) dataArr.push(null);

                const range = s.max - s.min;
                const buffer = range * 0.2;

                metricConfig[s.id] = {
                    label: s.name,
                    title: `${s.name}变化曲线 (${s.unit})`,
                    data: dataArr,
                    unit: s.unit,
                    color: s.color || 'slate',
                    min: Math.max(0, s.min - buffer),
                    max: s.max + buffer,
                    stepSize: Math.ceil(range / 5) || 1,
                    thMin: s.min,
                    thMax: s.max
                };
            });

            if (!metricConfig[currentMetric]) {
                currentMetric = sensors.length > 0 ? sensors[0].id : null;
            }
        }

        function initChart() {
            if (!currentMetric) return;
            loadData();
            initTabs();
            const initialConfig = metricConfig[currentMetric];
            const theme = { grid: cssVar('--border'), tick: cssVar('--text-3') };

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: initialConfig.label,
                        data: initialConfig.data,
                        borderColor: hueColor(initialConfig.color),
                        backgroundColor: hueColor(initialConfig.color, 0.10),
                        fill: true,
                        tension: 0.35,
                        pointRadius: labels.length > 50 ? 0 : 3,
                        pointBackgroundColor: cssVar('--card'),
                        pointBorderColor: hueColor(initialConfig.color),
                        pointBorderWidth: 2,
                        pointHoverRadius: 5,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 300 },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleFont: { size: 11 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            displayColors: false,
                            cornerRadius: 8,
                        }
                    },
                    scales: {
                        y: {
                            min: initialConfig.min,
                            max: initialConfig.max,
                            grid: { color: theme.grid, drawBorder: false, tickLength: 0 },
                            ticks: { font: { size: 10 }, color: theme.tick, stepSize: initialConfig.stepSize, padding: 8 }
                        },
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: {
                                font: { size: 10 }, color: theme.tick, padding: 8,
                                maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 12
                            }
                        }
                    },
                    interaction: { intersect: false, mode: 'index' }
                }
            });

            renderTable(currentMetric);
            updateTabStyles(currentMetric);
        }

        function renderTable(metricKey) {
            const dataTableBody = document.getElementById('dataTableBody');
            const selected = metricConfig[metricKey];
            if (!selected) return;

            const validDataCount = selected.data.filter(d => d !== null).length;
            if (validDataCount === 0) {
                dataTableBody.innerHTML = '<div class="text-center text-tip py-8" style="font-size: 12px;">暂无历史数据</div>';
                return;
            }

            let html = '';
            const thMin = selected.thMin;
            const thMax = selected.thMax;

            for (let i = selected.data.length - 1; i >= 0; i--) {
                const value = selected.data[i];
                if (value === null) continue;

                const displayTime = fullTimes[i] || labels[i];

                // Find the original sensor config to get dataType and step
                const sensorConfig = currentModel.sensors.find(s => s.id === metricKey) || {};

                let displayVal;
                let isExceed = false;

                if (sensorConfig.dataType === 'string' || sensorConfig.dataType === 'boolean') {
                    displayVal = String(value);
                } else {
                    const numericVal = Number(value);
                    isExceed = (numericVal < thMin || numericVal > thMax);
                    const decimals = typeof getDecimals === 'function' ? getDecimals(sensorConfig.dataType, sensorConfig.step) : 1;
                    displayVal = numericVal.toFixed(decimals);
                }

                const valColor = isExceed ? 'var(--danger)' : 'var(--text)';

                html += `
                <div class="data-row">
                    <div class="flex items-center gap-2.5">
                        <span class="dot ${isExceed ? 'dot-alarm' : 'dot-off'}" style="width: 6px; height: 6px;"></span>
                        <span class="text-sub">${displayTime}</span>
                    </div>
                    <span class="num" style="color: ${valColor};">${displayVal} <span class="text-tip" style="font-size: 10px;">${selected.unit}</span></span>
                </div>`;
            }
            dataTableBody.innerHTML = html;
        }

        function updateTabStyles(metricKey) {
            if (!metricConfig[metricKey]) return;
            chartTitle.textContent = metricConfig[metricKey].title;
            document.querySelectorAll('.metric-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.metric === metricKey);
            });
        }

        function setMetric(metricKey) {
            if (currentMetric === metricKey || !metricConfig[metricKey]) return;
            currentMetric = metricKey;

            historyChartWrap.style.opacity = '0.6';
            const selected = metricConfig[metricKey];

            historyChart.data.datasets[0].label = selected.label;
            historyChart.data.datasets[0].data = selected.data;
            historyChart.data.datasets[0].borderColor = hueColor(selected.color);
            historyChart.data.datasets[0].pointBorderColor = hueColor(selected.color);
            historyChart.data.datasets[0].backgroundColor = hueColor(selected.color, 0.10);
            historyChart.options.scales.y.min = selected.min;
            historyChart.options.scales.y.max = selected.max;
            historyChart.options.scales.y.ticks.stepSize = selected.stepSize;
            historyChart.update();

            setTimeout(() => historyChartWrap.style.opacity = '1', 250);

            renderTable(metricKey);
            updateTabStyles(metricKey);
        }

        async function syncData() {
            try {
                if (typeof OneNetService !== 'undefined') {
                    const data = await OneNetService.getLatestData();
                    if (data) {
                        const deviceStatusEl = document.getElementById('deviceStatus');
                        if (data._isOnline === false) {
                            deviceStatusEl.classList.remove('hidden');
                            deviceStatusEl.classList.add('flex');
                            deviceStatusEl.innerHTML = '<span class="dot dot-warn" style="width: 6px; height: 6px;"></span> 设备已离线';
                        } else {
                            deviceStatusEl.classList.remove('hidden');
                            deviceStatusEl.classList.add('flex');
                            deviceStatusEl.innerHTML = '<span class="dot dot-ok" style="width: 6px; height: 6px;"></span> 设备在线';
                        }

                        loadData();
                        if (!currentMetric || !metricConfig[currentMetric]) return;

                        const selected = metricConfig[currentMetric];

                        historyChart.data.labels = labels;
                        historyChart.data.datasets[0].data = selected.data;
                        historyChart.data.datasets[0].pointRadius = labels.length > 50 ? 0 : 3;
                        historyChart.update('none');

                        renderTable(currentMetric);
                    }
                }
            } catch (error) {
                console.error('History sync failed:', error);
            }
        }

        initChart();
        setInterval(syncData, 30000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const newModelStr = localStorage.getItem('iot_data_model');
                if (newModelStr && JSON.stringify(currentModel) !== newModelStr) {
                    window.location.reload(); // Simple reload handles chart re-init easily
                }
            }
        });
    </script>
</body>
</html>
