<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 登录</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { overflow: hidden; }
        .login-wrap {
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; transform: translateY(-5%);
        }
        .login-box { width: 100%; max-width: 22rem; }
        .login-logo {
            width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px;
            background: var(--accent); color: var(--on-accent);
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        .login-title { font-size: 22px; font-weight: 600; }
        .login-sub { font-size: 13px; color: var(--text-3); margin-top: 6px; }
        .login-footer {
            position: absolute; bottom: 40px; left: 0; right: 0;
            text-align: center; font-size: 12px; color: var(--text-3);
        }
    </style>
</head>
<body>

    <div class="login-wrap">
        <div class="login-box">
            <!-- Logo -->
            <div class="flex flex-col items-center mb-12">
                <div class="login-logo"><i class="fas fa-microchip"></i></div>
                <h1 class="login-title">机房监控系统</h1>
                <p class="login-sub">物联网设备监控与管理平台</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="flex flex-col gap-5">
                <div class="field">
                    <i class="fas fa-user field-icon"></i>
                    <input type="text" id="username" name="username" placeholder="请输入账号" class="input input-icon" autocomplete="username">
                </div>

                <div class="field">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="password" name="password" placeholder="请输入密码" class="input input-icon" autocomplete="current-password">
                </div>

                <div class="flex items-center">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="autoLogin" class="checkbox">
                        <span class="text-sm text-sub">自动登录</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-2">进入系统</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">© 2026 分布式机房监控系统</div>

    <!-- Toast -->
    <div id="toast" class="toast"><i class="fas fa-exclamation-circle"></i> <span id="toastMsg">账号或密码错误！</span></div>

    <script>
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 7天免登录检查
        window.addEventListener('DOMContentLoaded', () => {
            const lastLogin = localStorage.getItem('lastLoginTime');
            if (lastLogin) {
                const now = Date.now();
                const sevenDays = 7 * 24 * 60 * 60 * 1000;
                if (now - parseInt(lastLogin) < sevenDays) {
                    window.location.href = 'index.html';
                }
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const autoLogin = document.getElementById('autoLogin').checked;

            if (username === 'NaHS' && password === '12345678') {
                if (autoLogin) {
                    localStorage.setItem('lastLoginTime', Date.now());
                } else {
                    localStorage.removeItem('lastLoginTime');
                }
                window.location.href = 'index.html';
            } else {
                showToast('账号或密码错误！');
            }
        });
    </script>
</body>
</html>
