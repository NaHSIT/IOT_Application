<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 环境监测</title>
    <link rel="stylesheet" href="css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <style>
        .trend-wrap { height: 224px; transition: opacity 0.25s ease; cursor: pointer; }
    </style>
</head>
<body class="pb-nav">
    <!-- Header -->
    <header class="subheader">
        <a href="index.html" class="subheader-back">
            <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="subheader-title">实时环境监测</h1>
        <div class="subheader-side">
            <button id="refreshBtn" class="flex items-center gap-1.5 text-accent text-sm cursor-pointer">
                <span>刷新</span>
                <i class="fas fa-cog text-xs" id="refreshIcon"></i>
            </button>
        </div>
    </header>

    <main class="px-5 py-5 flex flex-col gap-4">
        <!-- Dynamic Sensors -->
        <div id="sensorCardsContainer" class="flex flex-col gap-4"></div>

        <!-- Trend Chart -->
        <div class="card p-5">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-base font-medium">近30分钟变化趋势</h3>
                <a href="history.html" id="historyLink" class="text-xs text-accent flex items-center gap-1">
                    历史详情 <i class="fas fa-chevron-right" style="font-size: 10px;"></i>
                </a>
            </div>

            <!-- Segmented Control Tabs -->
            <div id="chartTabsContainer" class="tabs mb-5 overflow-auto" style="flex-wrap: nowrap;"></div>

            <div id="trendChartWrap" class="chart-box trend-wrap" onclick="document.getElementById('historyLink').click()">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="monitoring.html" class="nav-item active">
            <i class="fas fa-chart-bar"></i>
            <span>监测</span>
        </a>
        <a href="video.html" class="nav-item">
            <i class="fas fa-video"></i>
            <span>视频</span>
        </a>
        <a href="control.html" class="nav-item">
            <i class="fas fa-sliders-h"></i>
            <span>控制</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <script>
        const currentModel = getDataModel();
        const sensors = currentModel.sensors;

        // 图表颜色取自主题变量，自动适配深浅色
        function hueColor(color, alpha) {
            const v = getComputedStyle(document.documentElement).getPropertyValue(`--hue-${color}`).trim() || '#5f6b7a';
            if (alpha === undefined) return v;
            // #rrggbb -> rgba
            const n = parseInt(v.slice(1), 16);
            return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
        }
        const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        let currentMetric = sensors.length > 0 ? sensors[0].id : null;
        let trendChart = null;

        // Initialize UI
        function initUI() {
            const container = document.getElementById('sensorCardsContainer');
            const tabsContainer = document.getElementById('chartTabsContainer');

            sensors.forEach((s, index) => {
                const colors = COLOR_CLASSES[s.color] || COLOR_CLASSES['slate'];

                // Card
                container.innerHTML += `
                    <a href="history.html?metric=${s.id}" class="card px-5 py-4 flex justify-between items-center pressable">
                        <div>
                            <div class="text-xs text-tip mb-1">${s.name}</div>
                            <div class="flex items-baseline">
                                <span id="val-${s.id}" class="text-xl font-medium num">--</span>
                                <span class="text-tip text-xs ml-1">${s.unit}</span>
                            </div>
                            <div id="status-${s.id}" class="flex items-center gap-2 mt-2">
                                <span class="dot dot-off"></span>
                                <span class="text-tip" style="font-size: 11px;">等待数据 (范围 ${s.min}-${s.max}${s.unit})</span>
                            </div>
                        </div>
                        <div class="tile tile-lg ${colors.bg}" style="font-size: 22px;">
                            <i class="fas ${s.icon}"></i>
                        </div>
                    </a>
                `;

                // Tab
                const isSelected = index === 0;
                tabsContainer.innerHTML += `
                    <button type="button" data-metric="${s.id}" class="metric-tab tab ${isSelected ? 'active' : ''}">
                        ${s.name}
                    </button>
                `;
            });

            // Tab Event Listeners
            document.querySelectorAll('.metric-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    setMetric(this.dataset.metric);
                });
            });

            document.getElementById('historyLink').href = `history.html?metric=${currentMetric}`;
        }

        initUI();

        // 页面加载时尝试读取本地缓存
        const cachedData = localStorage.getItem('iot_latest_data');
        if (cachedData) {
            try { updateCards(JSON.parse(cachedData)); }
            catch (e) { console.error(e); }
        }

        // 同步 OneNet 数据
        async function syncData(isManual = false) {
            const refreshIcon = document.getElementById('refreshIcon');
            if (isManual && refreshIcon) refreshIcon.classList.add('fa-spin');

            try {
                if (typeof OneNetService !== 'undefined') {
                    const data = await OneNetService.getLatestData();
                    if (data) {
                        updateCards(data);
                        updateChartRealtime(data);
                    }
                }
            } catch (error) {
                console.error('Sync failed:', error);
            } finally {
                if (isManual && refreshIcon) {
                    setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
                }
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', () => syncData(true));

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const newModelStr = localStorage.getItem('iot_data_model');
                if (newModelStr && JSON.stringify(currentModel) !== newModelStr) {
                    window.location.reload(); // Simplest way to cleanly rebuild the charts and tabs
                }
            }
        });

        function updateCards(data) {
            sensors.forEach(s => {
                if (data[s.id] !== undefined) {
                    let displayVal;
                    let numericVal = null;

                    if (s.dataType === 'string' || s.dataType === 'boolean') {
                        displayVal = String(data[s.id]);
                    } else {
                        const decimals = typeof getDecimals === 'function' ? getDecimals(s.dataType, s.step) : 1;
                        displayVal = Number(data[s.id]).toFixed(decimals);
                        numericVal = Number(displayVal);
                    }

                    document.getElementById(`val-${s.id}`).innerText = displayVal;

                    const statusEl = document.getElementById(`status-${s.id}`);
                    if (numericVal !== null && (numericVal > s.max || numericVal < s.min)) {
                        statusEl.innerHTML = `<span class="dot dot-alarm"></span><span style="font-size: 11px; color: var(--danger);">状态异常 (${numericVal > s.max ? '偏高' : '偏低'})</span>`;
                    } else {
                        statusEl.innerHTML = `<span class="dot dot-ok"></span><span style="font-size: 11px; color: var(--ok);">状态正常 ${s.dataType !== 'string' && s.dataType !== 'boolean' ? `(${s.min}-${s.max}${s.unit})` : ''}</span>`;
                    }
                }
            });
        }

        // --- Chart Logic ---
        const ctx = document.getElementById('trendChart').getContext('2d');

        let historyData = JSON.parse(localStorage.getItem('iot_history_data') || '[]');
        const displayData = historyData.slice(-7);
        const labels = displayData.map(item => item.time);

        if (labels.length === 0) {
            const now = new Date();
            labels.push(`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`);
        }

        // Precompute chart configs for all sensors
        const metricConfig = {};
        sensors.forEach(s => {
            let dataArr = displayData.map(item => item.data[s.id] !== undefined ? item.data[s.id] : null);
            if (dataArr.length === 0) dataArr.push(null);

            const range = s.max - s.min;
            const buffer = range * 0.2;

            metricConfig[s.id] = {
                label: s.name,
                data: dataArr,
                color: s.color || 'slate',
                min: Math.max(0, s.min - buffer),
                max: s.max + buffer,
                stepSize: Math.ceil(range / 5) || 1
            };
        });

        function chartTheme() {
            return {
                grid: cssVar('--border'),
                tick: cssVar('--text-3')
            };
        }

        if (currentMetric && metricConfig[currentMetric]) {
            const initialConfig = metricConfig[currentMetric];
            const theme = chartTheme();
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: initialConfig.label,
                        data: initialConfig.data,
                        borderColor: hueColor(initialConfig.color),
                        backgroundColor: hueColor(initialConfig.color, 0.10),
                        fill: true,
                        tension: 0.35,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 300 },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleFont: { size: 11 }, bodyFont: { size: 12 }, padding: 10, displayColors: false, cornerRadius: 8 }
                    },
                    scales: {
                        y: {
                            min: initialConfig.min,
                            max: initialConfig.max,
                            grid: { color: theme.grid, drawBorder: false, tickLength: 0 },
                            ticks: { font: { size: 10 }, color: theme.tick, stepSize: initialConfig.stepSize, padding: 8 }
                        },
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { font: { size: 10 }, color: theme.tick, padding: 8 }
                        }
                    },
                    interaction: { intersect: false, mode: 'index' }
                }
            });
        }

        function setMetric(metricKey) {
            if (currentMetric === metricKey || !trendChart || !metricConfig[metricKey]) return;
            currentMetric = metricKey;

            document.getElementById('historyLink').href = `history.html?metric=${currentMetric}`;

            const trendChartWrap = document.getElementById('trendChartWrap');
            trendChartWrap.style.opacity = '0.6';

            const selected = metricConfig[metricKey];
            trendChart.data.datasets[0].label = selected.label;
            trendChart.data.datasets[0].data = selected.data;
            trendChart.data.datasets[0].borderColor = hueColor(selected.color);
            trendChart.data.datasets[0].backgroundColor = hueColor(selected.color, 0.10);
            trendChart.options.scales.y.min = selected.min;
            trendChart.options.scales.y.max = selected.max;
            trendChart.options.scales.y.ticks.stepSize = selected.stepSize;
            trendChart.update();

            setTimeout(() => trendChartWrap.style.opacity = '1', 250);

            document.querySelectorAll('.metric-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.metric === metricKey);
            });
        }

        function updateChartRealtime(data) {
            if (!trendChart || !currentMetric) return;

            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const newValue = data[currentMetric];
            if (newValue === undefined) return;

            trendChart.data.labels.push(timeStr);
            trendChart.data.datasets[0].data.push(newValue);

            // Also update the background config array so switching tabs preserves the new data point
            metricConfig[currentMetric].data.push(newValue);

            if (trendChart.data.labels.length > 7) {
                trendChart.data.labels.shift();
                trendChart.data.datasets[0].data.shift();
                metricConfig[currentMetric].data.shift();
            }

            trendChart.update('none');
        }

        setTimeout(syncData, 500);
        setInterval(syncData, 10000);
    </script>
</body>
</html>
