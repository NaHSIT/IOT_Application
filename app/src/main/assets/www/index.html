<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 首页</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
</head>
<body class="pb-nav">
    <!-- Top Header -->
    <header class="page-header">
        <div class="header-row">
            <div>
                <h1 id="mainTitle" class="header-title mb-1.5">OneNet物联网后台</h1>
                <div class="header-sub">
                    <span id="connIndicator" class="dot dot-off"></span>
                    <span id="connStatus" class="text-sub">正在连接...</span>
                </div>
            </div>
            <button id="syncBtn" class="icon-btn">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <main class="px-5 mt-4 flex flex-col gap-4">
        <!-- Alert Banner -->
        <a href="alerts.html" id="alertBanner" class="hidden banner-danger items-center justify-between p-4">
            <div class="flex items-center gap-3">
                <div class="tile" style="background: var(--danger); color: #fff;">
                    <i class="fas fa-exclamation-triangle text-sm"></i>
                </div>
                <div>
                    <h3 class="text-sm font-medium" style="color: var(--danger);">环境异常警报</h3>
                    <p id="alertMessage" class="text-xs mt-0.5" style="color: var(--danger); opacity: .75;">检测到数据异常</p>
                </div>
            </div>
            <i class="fas fa-chevron-right text-xs" style="color: var(--danger); opacity: .5;"></i>
        </a>

        <!-- Monitoring Cards Grid -->
        <div class="grid grid-cols-2 gap-4" id="cardsGrid">
            <!-- Dynamically populated by JS -->
        </div>

        <!-- Quick Actions -->
        <div class="card p-4">
            <div class="grid grid-cols-3 gap-2">
                <a href="history.html" class="flex flex-col items-center gap-2 pressable">
                    <div class="tile tile-lg bg-muted text-sub" style="font-size: 18px;">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <span class="text-xs text-sub">历史数据</span>
                </a>
                <a href="alerts.html" class="flex flex-col items-center gap-2 pressable">
                    <div class="tile tile-lg bg-muted text-sub" style="font-size: 18px;">
                        <i class="fas fa-bell"></i>
                    </div>
                    <span class="text-xs text-sub">报警记录</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center gap-2 pressable">
                    <div class="tile tile-lg bg-muted text-sub" style="font-size: 18px;">
                        <i class="fas fa-cog"></i>
                    </div>
                    <span class="text-xs text-sub">系统设置</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="monitoring.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>监测</span>
        </a>
        <a href="video.html" class="nav-item">
            <i class="fas fa-video"></i>
            <span>视频</span>
        </a>
        <a href="control.html" class="nav-item">
            <i class="fas fa-sliders-h"></i>
            <span>控制</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <!-- Custom Confirm Modal for OneNet Config -->
    <div id="onenetAlertModal" class="modal-mask hidden">
        <div class="absolute inset-0" id="oamBackdrop" onclick="closeOneNetAlertModal()"></div>
        <div class="modal-card relative z-10" id="oamContent">
            <div class="modal-header">
                <div class="tile" style="background: var(--warn-bg); color: var(--warn);">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div>
                    <h3 class="modal-title">未配置云平台</h3>
                    <p class="modal-sub">需要配置 OneNet 参数</p>
                </div>
            </div>

            <div class="modal-body">
                系统尚未配置云平台连接参数，无法获取设备数据。是否立即前往“系统设置”进行配置？
            </div>

            <div class="modal-footer">
                <button onclick="closeOneNetAlertModal()" class="btn btn-ghost">取消</button>
                <button onclick="goToSettings()" class="btn btn-primary">立即配置</button>
            </div>
        </div>
    </div>

    <script>
        let currentModel = getDataModel();

        function loadDashboardTitle() {
            const customTitle = localStorage.getItem('iot_dashboard_title');
            if (customTitle) {
                document.getElementById('mainTitle').innerText = customTitle;
            } else {
                document.getElementById('mainTitle').innerText = 'OneNet物联网后台';
            }
        }

        // Render Dashboard UI
        function renderDashboard() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            currentModel.sensors.forEach(s => {
                const colors = COLOR_CLASSES[s.color] || COLOR_CLASSES['slate'];
                grid.innerHTML += `
                    <a href="monitoring.html" class="card stat-card p-4 flex flex-col justify-between pressable">
                        <div class="flex justify-between items-start mb-3">
                            <div class="tile ${colors.bg}">
                                <i class="fas ${s.icon}"></i>
                            </div>
                            <span id="sensor-status-${s.id}" class="tag tag-muted">获取中</span>
                        </div>
                        <div>
                            <div class="flex items-baseline flex-wrap">
                                <span id="sensor-val-${s.id}" class="text-2xl font-medium num">--</span>
                                <span class="text-tip text-xs ml-1">${s.unit}</span>
                            </div>
                            <div class="text-xs text-tip mt-1 truncate">${s.name}</div>
                        </div>
                    </a>
                `;
            });

            currentModel.controls.forEach(c => {
                const colors = COLOR_CLASSES[c.color] || COLOR_CLASSES['slate'];
                grid.innerHTML += `
                    <a href="control.html" class="card col-span-2 px-4 py-3.5 flex items-center justify-between pressable">
                        <div class="flex items-center gap-3">
                            <div class="tile tile-sm ${colors.bg}">
                                <i class="fas ${c.icon} text-sm"></i>
                            </div>
                            <span class="text-base font-medium">${c.name}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span id="control-status-${c.id}" class="tag tag-muted">--</span>
                            <i class="fas fa-chevron-right text-tip text-xs"></i>
                        </div>
                    </a>
                `;
            });
        }

        loadDashboardTitle();
        renderDashboard();

        // 同步数据逻辑
        async function syncData() {
            const syncBtn = document.getElementById('syncBtn');
            const syncIcon = syncBtn.querySelector('i');
            const connIndicator = document.getElementById('connIndicator');
            const connStatus = document.getElementById('connStatus');

            syncIcon.classList.add('fa-spin');
            syncBtn.disabled = true;

            try {
                if (typeof OneNetService !== 'undefined') {
                    const data = await OneNetService.getLatestData();
                    if (data) {
                        updateUI(data);
                        if (data._isOnline === false) {
                            connIndicator.className = 'dot dot-warn';
                            connStatus.innerText = '设备离线';
                            connStatus.className = 'text-warn';
                        } else {
                            connIndicator.className = 'dot dot-ok';
                            connStatus.innerText = '设备在线';
                            connStatus.className = 'text-ok';
                        }
                    } else {
                        throw new Error('未获取到有效数据');
                    }
                }
            } catch (error) {
                console.error('Sync failed:', error);
            } finally {
                setTimeout(() => {
                    syncIcon.classList.remove('fa-spin');
                    syncBtn.disabled = false;
                }, 1000);
            }
        }

        function updateUI(data, isFromCache = false) {
            let hasAlert = false;
            let latestAlertMsg = '';

            const checkAlert = (type, val, thresh, title, isHigh) => {
                if (isFromCache || data._isMock || data._isOnline === false) return;

                let alarmStates = JSON.parse(localStorage.getItem('iot_alarm_states') || '{}');
                const stateKey = `${type}_${isHigh ? 'high' : 'low'}`;

                if (isHigh ? val > thresh : val < thresh) {
                    hasAlert = true;
                    latestAlertMsg = title;

                    if (alarmStates[stateKey]) return;

                    let alerts = JSON.parse(localStorage.getItem('iot_alerts') || '[]');
                    const lastAlert = alerts.find(a => a.title === title);
                    const now = new Date();

                    if (!lastAlert || (now.getTime() - new Date(lastAlert.timestamp).getTime() > 5 * 60 * 1000)) {
                        alarmStates[stateKey] = true;
                        localStorage.setItem('iot_alarm_states', JSON.stringify(alarmStates));

                        // Find the unit from either sensors or videoData
                        let unit = '';
                        const sensorItem = currentModel.sensors.find(s => s.id === type);
                        if (sensorItem) {
                            unit = sensorItem.unit || '';
                        } else if (currentModel.videoData) {
                            const videoItem = currentModel.videoData.find(v => v.id === type);
                            if (videoItem) unit = videoItem.unit || '';
                        }

                        alerts.unshift({
                            id: Date.now(),
                            title: title,
                            type: type,
                            currentValue: val,
                            threshold: thresh,
                            unit: unit,
                            time: `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`,
                            timestamp: now.getTime(),
                            status: 'unread',
                            isCritical: true
                        });
                        if(alerts.length > 50) alerts.pop();
                        localStorage.setItem('iot_alerts', JSON.stringify(alerts));
                    }
                } else {
                    if (alarmStates[stateKey]) {
                        alarmStates[stateKey] = false;
                        localStorage.setItem('iot_alarm_states', JSON.stringify(alarmStates));
                    }
                }
            };

            currentModel.sensors.forEach(s => {
                if (data[s.id] !== undefined) {
                    let displayVal;
                    let isAlert = false;
                    let numericVal = null;

                    if (s.dataType === 'string' || s.dataType === 'boolean') {
                        displayVal = String(data[s.id]);
                    } else {
                        const decimals = typeof getDecimals === 'function' ? getDecimals(s.dataType, s.step) : 1;
                        displayVal = Number(data[s.id]).toFixed(decimals);
                        numericVal = Number(displayVal);
                    }

                    const valEl = document.getElementById(`sensor-val-${s.id}`);
                    if(valEl) valEl.innerText = displayVal;

                    const statusEl = document.getElementById(`sensor-status-${s.id}`);
                    if (statusEl) {
                        if (numericVal !== null && numericVal > s.max) {
                            isAlert = true;
                            statusEl.innerText = '过高';
                            statusEl.className = 'tag tag-alarm';
                            checkAlert(s.id, numericVal, s.max, `${s.name}过高报警`, true);
                        } else if (numericVal !== null && numericVal < s.min) {
                            isAlert = true;
                            statusEl.innerText = '过低';
                            statusEl.className = 'tag tag-alarm';
                            checkAlert(s.id, numericVal, s.min, `${s.name}过低报警`, false);
                        } else {
                            statusEl.innerText = '正常';
                            statusEl.className = 'tag tag-ok';
                        }
                    }
                }
            });

            currentModel.controls.forEach(c => {
                if (data[c.id] !== undefined) {
                    const statusEl = document.getElementById(`control-status-${c.id}`);
                    if (statusEl) {
                        if (c.dataType === 'int32' || c.dataType === 'float' || c.dataType === 'double' || c.dataType === 'string') {
                            statusEl.innerText = String(data[c.id]);
                            const colors = COLOR_CLASSES[c.color] || COLOR_CLASSES['slate'];
                            statusEl.className = `tag ${colors.chip}`;
                        } else {
                            const isOn = !!data[c.id];
                            statusEl.innerText = isOn ? '已开启' : '已关闭';
                            const colors = COLOR_CLASSES[c.color] || COLOR_CLASSES['slate'];
                            statusEl.className = isOn ? `tag ${colors.chip}` : 'tag tag-muted';
                        }
                    }
                }
            });

            // Check alerts for videoData
            if (currentModel.videoData) {
                currentModel.videoData.forEach(v => {
                    if (data[v.id] !== undefined) {
                        let numericVal = null;
                        if (v.dataType !== 'string' && v.dataType !== 'boolean') {
                            numericVal = Number(data[v.id]);

                            if (v.max !== undefined && numericVal > v.max) {
                                checkAlert(v.id, numericVal, v.max, `${v.name}过高报警`, true);
                            } else if (v.min !== undefined && numericVal < v.min) {
                                checkAlert(v.id, numericVal, v.min, `${v.name}过低报警`, false);
                            }
                        }
                    }
                });
            }

            const alertBanner = document.getElementById('alertBanner');
            if (hasAlert) {
                alertBanner.style.display = 'flex';
                document.getElementById('alertMessage').innerText = latestAlertMsg;
            } else {
                alertBanner.style.display = 'none';
            }
        }

        document.getElementById('syncBtn').addEventListener('click', syncData);

        // Add visibility listener to detect changes from settings page
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                loadDashboardTitle();
                const newModelStr = localStorage.getItem('iot_data_model');
                if (newModelStr && JSON.stringify(currentModel) !== newModelStr) {
                    currentModel = JSON.parse(newModelStr);
                    renderDashboard(); // Re-render completely with new model
                    syncData(); // Fetch fresh data for the new model
                }
            }
        });

        const cachedData = localStorage.getItem('iot_latest_data');
        if (cachedData) {
            try { updateUI(JSON.parse(cachedData), true); }
            catch (e) { console.error(e); }
        }

        // Check OneNet config on startup
        function checkOneNetConfig() {
            const config = JSON.parse(localStorage.getItem('iot_onenet_config') || 'null');
            if (!config || !config.productId || !config.deviceName || !config.token) {
                const connIndicator = document.getElementById('connIndicator');
                const connStatus = document.getElementById('connStatus');
                if(connIndicator && connStatus) {
                    connIndicator.className = 'dot dot-warn';
                    connStatus.innerText = '请先前往设置配置OneNet';
                    connStatus.className = 'text-warn';
                }
                setTimeout(openOneNetAlertModal, 500);
                return false;
            }
            return true;
        }

        function openOneNetAlertModal() {
            const modal = document.getElementById('onenetAlertModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('show'), 30);
        }

        function closeOneNetAlertModal() {
            const modal = document.getElementById('onenetAlertModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function goToSettings() {
            window.location.href = 'settings.html';
        }

        if(checkOneNetConfig()) {
            setTimeout(syncData, 500);
            setInterval(syncData, 30000);
        }
    </script>
</body>
</html>
