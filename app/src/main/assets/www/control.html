<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 设备控制</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <style>
        .input-inline { width: 88px; padding: 7px 8px; font-size: 13px; text-align: center; border-radius: 9px; }
        .input-inline-text { width: 110px; text-align: left; }
        .log-time { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
</head>
<body class="pb-nav">
    <!-- Header -->
    <header class="subheader">
        <a href="index.html" class="subheader-back">
            <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="subheader-title">设备远程控制</h1>
        <div class="subheader-side">
            <div class="flex items-center gap-1.5">
                <span class="dot dot-ok"></span>
                <span class="text-ok" style="font-size: 11px;">设备在线</span>
            </div>
        </div>
    </header>

    <main class="px-5 py-5 flex flex-col gap-5">

        <!-- Dynamic Control Cards -->
        <div id="controlsContainer" class="flex flex-col gap-4"></div>

        <!-- History Section -->
        <div>
            <div class="flex justify-between items-center mb-3 px-1">
                <h3 class="text-sm font-medium">最近操作记录</h3>
                <button onclick="clearLogs()" class="text-tip px-1">
                    <i class="fas fa-trash-alt text-sm"></i>
                </button>
            </div>
            <div class="flex flex-col gap-3" id="operationLogs">
                <!-- Logs will be generated here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="monitoring.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>监测</span>
        </a>
        <a href="video.html" class="nav-item">
            <i class="fas fa-video"></i>
            <span>视频</span>
        </a>
        <a href="control.html" class="nav-item active">
            <i class="fas fa-sliders-h"></i>
            <span>控制</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="modal-mask hidden">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-body">
                <h3 class="modal-title mb-2">清空操作记录</h3>
                <p class="text-sm text-sub">确定要清空所有操作记录吗？此操作无法恢复。</p>
            </div>
            <div class="modal-footer">
                <button onclick="closeConfirmModal()" class="btn btn-ghost">取消</button>
                <button onclick="executeClearLogs()" class="btn" style="background: var(--danger); color: #fff;">确认清空</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" style="top: auto; bottom: 96px;">
        操作成功
    </div>

    <script>
        const currentModel = getDataModel();
        const controls = currentModel.controls;

        let operationLogs = JSON.parse(localStorage.getItem('iot_operation_logs') || '[]');

        function initUI() {
            const container = document.getElementById('controlsContainer');
            container.innerHTML = '';

            controls.forEach(c => {
                const colors = COLOR_CLASSES[c.color] || COLOR_CLASSES['slate'];
                let controlUI = '';

                if (c.dataType === 'int32' || c.dataType === 'float' || c.dataType === 'double') {
                    controlUI = `
                        <div class="flex items-center gap-2">
                            <input type="number" id="input-${c.id}" step="${c.step || 1}" class="input input-inline">
                            <button onclick="handleNumericControl('${c.id}')" class="btn btn-primary btn-sm">下发</button>
                        </div>
                    `;
                } else if (c.dataType === 'string') {
                    controlUI = `
                        <div class="flex items-center gap-2">
                            <input type="text" id="input-${c.id}" class="input input-inline input-inline-text">
                            <button onclick="handleStringControl('${c.id}')" class="btn btn-primary btn-sm">下发</button>
                        </div>
                    `;
                } else {
                    // default bool
                    controlUI = `
                        <label class="switch">
                            <input type="checkbox" id="toggle-${c.id}" onchange="handleControl('${c.id}')"/>
                            <span class="slider"></span>
                        </label>
                    `;
                }

                container.innerHTML += `
                    <div class="card p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3.5">
                            <div class="tile ${colors.bg}" style="width: 48px; height: 48px; font-size: 20px;">
                                <i class="fas ${c.icon}"></i>
                            </div>
                            <div>
                                <h2 class="text-base font-medium">${c.name}</h2>
                                <p class="text-tip text-xs mt-0.5 log-time">${c.cloudKey}</p>
                            </div>
                        </div>
                        ${controlUI}
                    </div>
                `;
            });
        }

        function renderLogs() {
            const container = document.getElementById('operationLogs');
            if (operationLogs.length === 0) {
                container.innerHTML = '<div class="text-center text-tip text-xs py-4">暂无操作记录</div>';
                return;
            }

            // Create a map of IDs to names
            const deviceNames = {};
            controls.forEach(c => deviceNames[c.id] = c.name);

            container.innerHTML = operationLogs.slice(0, 10).map(log => {
                const isTurnOn = log.status === true;
                let title;
                if (typeof log.status === 'boolean') {
                    title = `${isTurnOn ? '开启' : '关闭'} ${deviceNames[log.device] || log.device}`;
                } else {
                    title = `设置 ${deviceNames[log.device] || log.device} 为 ${log.status}`;
                }
                const iconClass = isTurnOn || typeof log.status !== 'boolean' ? 'fa-play ml-0.5' : 'fa-power-off';
                const tileClass = isTurnOn || typeof log.status !== 'boolean' ? 'tile-blue' : 'tile-green';

                return `
                <div class="card px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="tile tile-sm ${tileClass}">
                            <i class="fas ${iconClass}" style="font-size: 12px;"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-medium">${title}</h4>
                            <p class="text-tip mt-0.5 log-time" style="font-size: 11px;">${log.time}</p>
                        </div>
                    </div>
                    <span class="tag tag-ok">执行成功</span>
                </div>
                `;
            }).join('');
        }

        function addLog(device, status) {
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            operationLogs.unshift({ device, status, time: timeStr });
            if (operationLogs.length > 20) operationLogs.pop();
            localStorage.setItem('iot_operation_logs', JSON.stringify(operationLogs));
            renderLogs();
        }

        function clearLogs() {
            if (operationLogs.length === 0) return;
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => requestAnimationFrame(() => {
                modal.classList.add('show');
            }));
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function executeClearLogs() {
            closeConfirmModal();
            operationLogs = [];
            localStorage.removeItem('iot_operation_logs');
            renderLogs();
            setTimeout(() => {
                showToast('记录已清空');
            }, 200);
        }

        async function handleNumericControl(id) {
            const input = document.getElementById(`input-${id}`);
            const value = parseFloat(input.value);
            if (isNaN(value)) {
                showToast('请输入有效数字');
                return;
            }
            await sendControlCommand(id, value);
        }

        async function handleStringControl(id) {
            const input = document.getElementById(`input-${id}`);
            const value = input.value;
            await sendControlCommand(id, value);
        }

        // 开关的选中态由 CSS（input:checked + .slider）处理，这里保留空实现以兼容旧调用
        function updateToggleUI(elementId) {}

        async function handleControl(id) {
            const checkbox = document.getElementById(`toggle-${id}`);
            if (!checkbox) return;
            const value = checkbox.checked;

            checkbox.disabled = true;

            const success = await sendControlCommand(id, value);

            if (!success) {
                // Only revert if sendControlCommand explicitly returned false (failed)
                checkbox.checked = !value;
            }
            checkbox.disabled = false;
        }

        async function sendControlCommand(id, value) {
            try {
                if (typeof OneNetService !== 'undefined') {
                    const params = {};
                    params[id] = value;

                    const success = await OneNetService.setProperty(params);
                    if (success) {
                        showToast('指令下发成功');
                        addLog(id, value);
                        return true;
                    } else {
                        showToast('下发失败，请重试');
                        return false;
                    }
                }
            } catch (error) {
                console.error('Control failed:', error);
                showToast('网络异常');
                return false;
            }
            return false;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        async function syncStatus() {
            try {
                if (typeof OneNetService !== 'undefined') {
                    const data = await OneNetService.getLatestData();
                    if (data) {
                        controls.forEach(c => {
                            if (data[c.id] !== undefined) {
                                if (c.dataType === 'int32' || c.dataType === 'float' || c.dataType === 'double') {
                                    const input = document.getElementById(`input-${c.id}`);
                                    // only update if not currently focused to avoid typing interruption
                                    if (input && document.activeElement !== input) {
                                        input.value = data[c.id];
                                    }
                                } else if (c.dataType === 'string') {
                                    const input = document.getElementById(`input-${c.id}`);
                                    if (input && document.activeElement !== input) {
                                        input.value = data[c.id];
                                    }
                                } else {
                                    const checkbox = document.getElementById(`toggle-${c.id}`);
                                    if (checkbox) {
                                        checkbox.checked = data[c.id] === true || data[c.id] === 1 || data[c.id] === 'true' || data[c.id] === '1';
                                    }
                                }
                            }
                        });
                    }
                }
            } catch (error) {
                console.error('Sync status failed:', error);
            }
        }

        window.onload = () => {
            initUI();
            renderLogs();

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    const newModelStr = localStorage.getItem('iot_data_model');
                    if (newModelStr && JSON.stringify(currentModel) !== newModelStr) {
                        window.location.reload(); // Quick clean refresh of the dynamically generated DOM
                    }
                }
            });

            const cachedData = localStorage.getItem('iot_latest_data');
            if (cachedData) {
                try {
                    const data = JSON.parse(cachedData);
                    controls.forEach(c => {
                        if (data[c.id] !== undefined) {
                            if (c.dataType === 'int32' || c.dataType === 'float' || c.dataType === 'double' || c.dataType === 'string') {
                                const input = document.getElementById(`input-${c.id}`);
                                if (input) input.value = data[c.id];
                            } else {
                                const checkbox = document.getElementById(`toggle-${c.id}`);
                                if (checkbox) {
                                    checkbox.checked = data[c.id] === true || data[c.id] === 1 || data[c.id] === 'true' || data[c.id] === '1';
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.error('Parse cache error:', e);
                }
            }

            setTimeout(syncStatus, 500);
        };
    </script>
</body>
</html>
