<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <title>机房监控系统 - 报警记录</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <style>
        .filter-tabs {
            display: flex; gap: 24px; padding: 0 20px;
            background: var(--bg); border-bottom: 1px solid var(--border);
        }
        .filter-tabs .tab-btn {
            padding: 12px 2px; font-size: 13px; color: var(--text-2);
            border-bottom: 2px solid transparent; margin-bottom: -1px;
        }
        .filter-tabs .tab-btn.active {
            color: var(--accent); border-bottom-color: var(--accent); font-weight: 500;
        }
        .alert-card { position: relative; overflow: hidden; }
        .alert-card .bar {
            position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        }
        .alert-time { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        .read-alert { opacity: 0.55; }
    </style>
</head>
<body class="pb-nav">
    <!-- Header -->
    <header class="subheader">
        <a href="javascript:history.back()" class="subheader-back">
            <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="subheader-title">报警记录</h1>
        <div class="subheader-side" style="gap: 16px;">
            <button class="text-tip cursor-pointer" onclick="clearAllAlerts()">
                <i class="fas fa-trash-alt text-sm"></i>
            </button>
            <button class="text-accent text-sm cursor-pointer" onclick="markAllAsRead()">一键已读</button>
        </div>
    </header>

    <!-- Status Tabs -->
    <div class="filter-tabs" id="statusTabs">
        <button data-filter="all" class="tab-btn active">全部</button>
        <button data-filter="unread" class="tab-btn">未读</button>
        <button data-filter="read" class="tab-btn">已处理</button>
    </div>

    <main class="px-5 py-5 flex flex-col gap-4" id="alertsList">
        <!-- 动态生成的报警列表 -->
    </main>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="modal-mask hidden">
        <div class="modal-card">
            <div class="modal-body">
                <h3 class="modal-title mb-2">清空报警记录</h3>
                <p class="text-sm text-sub">确定要清空所有报警记录吗？此操作无法恢复。</p>
            </div>
            <div class="modal-footer">
                <button onclick="closeConfirmModal()" class="btn btn-ghost">取消</button>
                <button onclick="executeClearAll()" class="btn" style="background: var(--danger); color: #fff;">确认清空</button>
            </div>
        </div>
    </div>

    <!-- Custom Toast -->
    <div id="toast" class="toast">
        <!-- Toast message -->
    </div>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </a>
        <a href="monitoring.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>监测</span>
        </a>
        <a href="video.html" class="nav-item">
            <i class="fas fa-video"></i>
            <span>视频</span>
        </a>
        <a href="control.html" class="nav-item">
            <i class="fas fa-sliders-h"></i>
            <span>控制</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </a>
    </nav>
    <script>
        // 动态加载报警数据
        let alertsData = JSON.parse(localStorage.getItem('iot_alerts') || '[]');
        const currentModel = typeof getDataModel === 'function' ? getDataModel() : { sensors: [] };

        let currentFilter = 'all';

        const alertsList = document.getElementById('alertsList');
        const tabBtns = document.querySelectorAll('.tab-btn');

        function renderAlerts() {
            const filteredData = alertsData.filter(item => {
                if (currentFilter === 'all') return true;
                return item.status === currentFilter;
            });

            if (filteredData.length === 0) {
                alertsList.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-tip">
                        <i class="fas fa-bell-slash text-3xl mb-4 opacity-30"></i>
                        <span class="text-sm">暂无报警记录</span>
                    </div>
                ` + (currentFilter !== 'read' ? `
                    <button onclick="switchToReadTab()" class="btn btn-ghost btn-block mt-4">
                        查看历史报警记录
                    </button>
                ` : '');
                return;
            }

            alertsList.innerHTML = filteredData.map(alert => {
                const sensorConfig = currentModel.sensors.find(s => s.id === alert.type) || {};
                let displayVal, displayThresh;

                if (sensorConfig.dataType === 'string' || sensorConfig.dataType === 'boolean') {
                    displayVal = String(alert.currentValue);
                    displayThresh = String(alert.threshold);
                } else {
                    const decimals = typeof getDecimals === 'function' ? getDecimals(sensorConfig.dataType, sensorConfig.step) : 1;
                    displayVal = parseFloat(alert.currentValue).toFixed(decimals);
                    displayThresh = parseFloat(alert.threshold).toFixed(decimals);
                }

                const isRead = alert.status === 'unread' ? '' : 'read-alert';
                const barColor = alert.isCritical ? 'var(--danger)' : 'var(--accent)';
                const dotCls = alert.status === 'unread' ? (alert.isCritical ? 'dot-alarm' : 'dot-accent') : 'dot-off';
                const valColor = alert.status === 'unread' ? (alert.isCritical ? 'var(--danger)' : 'var(--accent)') : 'var(--text-3)';

                return `
                <div class="card alert-card p-4 pl-5 ${isRead}">
                    ${alert.status === 'unread' ? `<div class="bar" style="background: ${barColor};"></div>` : ''}

                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2.5">
                            <span class="dot ${dotCls}"></span>
                            <h3 class="text-base font-medium">${alert.title}</h3>
                        </div>
                        <span class="text-tip text-xs alert-time">${alert.time}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4 ml-5 ${alert.status === 'unread' ? 'mb-4' : ''}">
                        <div>
                            <div class="text-xs text-tip mb-1">当前值</div>
                            <div class="text-base font-medium num" style="color: ${valColor};">${displayVal}<span class="text-xs ml-0.5" style="font-size: 10px;">${alert.unit}</span></div>
                        </div>
                        <div>
                            <div class="text-xs text-tip mb-1">阈值</div>
                            <div class="text-base font-medium num">${displayThresh}<span class="text-xs ml-0.5" style="font-size: 10px;">${alert.unit}</span></div>
                        </div>
                    </div>

                    ${alert.status === 'unread' ? `
                        <div class="flex justify-end gap-3 pt-3 border-t mt-1">
                            <button onclick="ignoreAlert(${alert.id})" class="btn btn-ghost btn-sm">忽略</button>
                            <button onclick="viewDetail('${alert.type}')" class="btn btn-primary btn-sm">查看详情</button>
                        </div>
                    ` : ''}
                </div>
            `;
            }).join('') + (currentFilter !== 'read' ? `
                 <button onclick="switchToReadTab()" class="btn btn-ghost btn-block mt-2">
                     查看历史报警记录
                 </button>
             ` : '');
         }

         function switchToReadTab() {
             const readTab = document.querySelector('[data-filter="read"]');
             if (readTab) readTab.click();
             window.scrollTo({ top: 0, behavior: 'smooth' });
         }

         function markAllAsRead() {
            alertsData.forEach(alert => {
                alert.status = 'read';
            });
            localStorage.setItem('iot_alerts', JSON.stringify(alertsData));
            renderAlerts();
            showToast('已将所有报警标记为已处理');
        }

        function clearAllAlerts() {
            if (alertsData.length === 0) {
                showToast('暂无报警记录可清空');
                return;
            }

            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => requestAnimationFrame(() => {
                modal.classList.add('show');
            }));
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function executeClearAll() {
            closeConfirmModal();

            alertsData = [];
            localStorage.removeItem('iot_alerts');
            localStorage.removeItem('iot_alarm_states'); // 同时重置状态，允许重新报警

            // 清除首页缓存的旧数据，避免切换回去时再次闪烁出旧数据报警
            localStorage.removeItem('iot_latest_data');

            // 立即隐藏横幅（如果它之前在首页触发过）
            const alertBanner = document.getElementById('alertBanner');
            if(alertBanner) alertBanner.style.display = 'none';

            renderAlerts();

            setTimeout(() => {
                showToast('已清空所有报警记录！');
            }, 200);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function ignoreAlert(id) {
            const alert = alertsData.find(a => a.id === id);
            if (alert) {
                alert.status = 'read';
                localStorage.setItem('iot_alerts', JSON.stringify(alertsData));
                renderAlerts();
            }
        }

        function viewDetail(metricType) {
            window.location.href = `history.html?metric=${metricType}`;
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Update tabs styling
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                currentFilter = this.dataset.filter;
                renderAlerts();
            });
        });

        // 初始渲染
        renderAlerts();
    </script>
</body>
</html>
